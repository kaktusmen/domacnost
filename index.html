<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#000;--sec:#8e8e93;--sep:rgba(60,60,67,.18);--fill:rgba(118,118,128,.12);
--blue:#007aff;--green:#34c759;--red:#ff3b30;--orange:#ff9500;--yellow:#ffcc00;--purple:#af52de;--pink:#ff2d55;--teal:#30b0c7;
--r:12px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#fff;--sec:#8e8e93;--sep:rgba(84,84,88,.6);--fill:rgba(118,118,128,.24);--blue:#0a84ff;--green:#30d158;--red:#ff453a;--orange:#ff9f0a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-top:var(--safe-t)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text)}
#app{max-width:680px;margin:0 auto;padding:0 16px calc(96px + var(--safe-b))}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:14px 0 8px}
.hdr h1{font-size:34px;font-weight:700;letter-spacing:.3px;margin:0}
.hdr .sub{color:var(--sec);font-size:15px;margin-top:2px}
.back{color:var(--blue);font-size:17px;display:flex;align-items:center;gap:2px;padding:10px 0 0}
.hbtn{color:var(--blue);font-size:30px;line-height:1;width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center}
.hbtn:active{background:var(--fill)}
.sect{color:var(--sec);font-size:13px;text-transform:uppercase;letter-spacing:.2px;margin:22px 16px 7px;display:flex;justify-content:space-between;align-items:center}
.sect button{color:var(--blue);text-transform:none;font-size:15px}
.grp{background:var(--card);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:46px;position:relative;width:100%;text-align:left}
.row+.row::before,.row+.frow::before,.frow+.row::before,.frow+.frow::before,.fblk+.frow::before,.frow+.fblk::before,.fblk+.fblk::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.row.tap:active,button.row:active{background:var(--fill)}
.row .main{flex:1;min-width:0}
.row .t{font-size:17px;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:14px;color:var(--sec);margin-top:1px}
.row .r{color:var(--sec);font-size:15px;text-align:right;white-space:nowrap}
.chev::after{content:"›";color:var(--sec);opacity:.6;font-size:24px;margin-left:4px;line-height:1}
.ic{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;color:#fff}
.av{width:26px;height:26px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:none;color:#fff;vertical-align:middle}
.av.sm{width:20px;height:20px;font-size:11px}
.chk{width:24px;height:24px;border-radius:12px;border:2px solid var(--sec);flex:none;display:flex;align-items:center;justify-content:center;opacity:.8}
.chk.on{background:var(--green);border-color:var(--green);opacity:1}
.chk.on::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.done .t{text-decoration:line-through;color:var(--sec)}
.pill{display:inline-block;font-size:13px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--fill);color:var(--sec);white-space:nowrap}
.pill.red{background:rgba(255,59,48,.14);color:var(--red)}.pill.orange{background:rgba(255,149,0,.15);color:var(--orange)}
.pill.green{background:rgba(52,199,89,.15);color:var(--green)}.pill.blue{background:rgba(0,122,255,.13);color:var(--blue)}
.btn{background:var(--blue);color:#fff;border-radius:10px;padding:8px 14px;font-size:15px;font-weight:600;white-space:nowrap}
.btn.g{background:var(--fill);color:var(--blue)}.btn.green{background:var(--green)}.btn.red{background:var(--red)}
.btn.big{display:block;width:100%;padding:14px;font-size:17px;border-radius:12px;text-align:center;white-space:normal}
.btn:active{opacity:.7}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:4px 0 6px}
.seg button{flex:1;padding:6px 4px;border-radius:7px;font-size:14px;font-weight:500}
.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.12);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}
.tile{background:var(--card);border-radius:14px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:500}
.tile .ic{width:38px;height:38px;border-radius:10px;font-size:20px}
.tile:active{opacity:.6}
.card{background:var(--card);border-radius:var(--r);padding:14px 16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}

<body>
<div id="app"></div>
<nav class="tabbar" id="tabbar"></nav>
<div id="ov"></div>
<div id="sh"></div>
<div id="toast"></div>
<script>
/* ============ Pomocné funkcie ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const parse=s=>{const[a,b,c]=String(s).split('-').map(Number);return new Date(a,(b||1)-1,c||1)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const addMonths=(s,n)=>{const d=parse(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+Number(n));const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)};
const daysTo=s=>Math.round((parse(s)-parse(today()))/864e5);
const MON=['január','február','marec','apríl','máj','jún','júl','august','september','október','november','december'];
const MONC=['Január','Február','Marec','Apríl','Máj','Jún','Júl','August','September','Október','November','December'];
const DOW=['nedeľa','pondelok','utorok','streda','štvrtok','piatok','sobota'];
const fmtD=s=>{if(!s)return'';const d=parse(s);return d.getDate()+'. '+(d.getMonth()+1)+'. '+d.getFullYear()};
const fmtDL=s=>{const d=parse(s);return DOW[d.getDay()]+' '+d.getDate()+'. '+MON[d.getMonth()]};
const rel=s=>{if(!s)return'';const n=daysTo(s);if(n===0)return'dnes';if(n===1)return'zajtra';if(n===-1)return'včera';if(n<0)return'pred '+(-n)+' d';if(n<7)return DOW[parse(s).getDay()];return fmtD(s)};
const num=v=>{const n=parseFloat(String(v??'').replace(',','.').replace(/\s/g,''));return isNaN(n)?0:n};
const eur=n=>(Number(n)||0).toLocaleString('sk-SK',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const kwh=n=>Math.round(Number(n)||0).toLocaleString('sk-SK')+' kWh';
const pct=n=>isFinite(n)?Math.round(n*100)+' %':'–';
const ago=ts=>{const m=Math.round((Date.now()-ts)/6e4);if(m<1)return'práve teraz';if(m<60)return'pred '+m+' min';const h=Math.round(m/60);if(h<24)return'pred '+h+' h';const d=new Date(ts);return d.getDate()+'. '+(d.getMonth()+1)+'. '+pad(d.getHours())+':'+pad(d.getMinutes())};
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:(u&&/^[\w.-]+\.[a-z]{2,}/i.test(u)?'https://'+u:'');
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}

/* ============ Dáta ============ */
const COLS=['members','shopping','tasks','events','notes','bills','maint','energy','gifts','letters','meta'];
const D={};
COLS.forEach(c=>{try{D[c]=JSON.parse(localStorage.getItem('dm_'+c)||'[]')}catch(e){D[c]=[]}});
const saveL=c=>{try{localStorage.setItem('dm_'+c,JSON.stringify(D[c]))}catch(e){}};
const L=c=>D[c]||[];
let me=localStorage.getItem('dm_me')||'';
const S={tab:'home',sub:null,seg:{cal:'cal',gift:'mine',task:'mine'},calMonth:today().slice(0,7),calDay:today(),shopCat:'Potraviny',showDone:{},enYear:new Date().getFullYear()};
const mem=id=>L('members').find(m=>m.id===id);
const mName=id=>mem(id)?.name||'?';
const mTag=(id,sm)=>{const m=mem(id);if(!m)return'';if(m.photo&&/^data:image\//.test(m.photo))return `<img class="av${sm?' sm':''}" src="${m.photo}" alt="${esc(m.name)}" title="${esc(m.name)}" style="object-fit:cover;background:${m.color||'#8e8e93'}">`;return `<span class="av${sm?' sm':''}" style="background:${m.color||'#8e8e93'}" title="${esc(m.name)}">${esc(m.emoji||m.name[0])}</span>`};
const meta=()=>L('meta').find(x=>x.id==='settings')||{id:'settings'};
const isKid=()=>!!mem(me)?.kid;
const COLORS=[['#007aff','Modrá'],['#34c759','Zelená'],['#ff9500','Oranžová'],['#ff2d55','Ružová'],['#af52de','Fialová'],['#ff3b30','Červená'],['#30b0c7','Tyrkysová'],['#a2845e','Hnedá'],['#5856d6','Indigo']];

function put(c,o,silent){
  o=JSON.parse(JSON.stringify(o));if(!o.id)o.id=uid();o.upd=Date.now();
  const a=L(c).slice();const i=a.findIndex(x=>x.id===o.id);if(i>=0)a[i]=o;else a.push(o);D[c]=a;saveL(c);
  if(famRef)famRef.collection(c).doc(o.id).set(o).catch(syncErr);
  if(!silent)render();return o;
}
function del(c,id){
  D[c]=L(c).filter(x=>x.id!==id);saveL(c);
  if(famRef)famRef.collection(c).doc(id).delete().catch(syncErr);
  else{const t=JSON.parse(localStorage.getItem('dm_del')||'[]');t.push([c,id]);localStorage.setItem('dm_del',JSON.stringify(t))}
  render();
}

/* ============ Synchronizácia (Firebase, zadarmo) ============ */
const DEFAULT_CFG={apiKey:"AIzaSyAtv66geG7ffuZlFOAbQqyZbEN5L9gug30",authDomain:"domacnost-d9b09.firebaseapp.com",projectId:"domacnost-d9b09",storageBucket:"domacnost-d9b09.firebasestorage.app",messagingSenderId:"852081942371",appId:"1:852081942371:web:2739d9d5fd5772534fbd56"};
let famRef=null,sync={st:'local',msg:''},syncStart=Date.now();
const fbCfg=()=>{try{return JSON.parse(localStorage.getItem('dm_fb')||'null')}catch(e){return null}};
function loadScript(src){return new Promise((ok,bad)=>{if(document.querySelector('script[src="'+src+'"]'))return ok();const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>bad(new Error('Nepodarilo sa načítať '+src));document.head.appendChild(s)})}
function syncErr(e){sync={st:'err',msg:(e&&e.code==='permission-denied')?'Prístup zamietnutý – skontroluj pravidlá Firestore (Rules).':(e&&e.message)||String(e)};render()}
async function startSync(){
  const c=fbCfg();if(!c||!c.config||!c.fam){sync={st:'local',msg:''};return}
  sync={st:'wait',msg:'Pripájam…'};syncStart=Date.now();render();
  try{
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
    const app=firebase.apps.find(a=>a.name==='dom')||firebase.initializeApp(c.config,'dom');
    const db=app.firestore();
    famRef=db.collection('rodiny').doc(c.fam);
    famRef.set({nazov:c.name||'',pripojene:Date.now()},{merge:true}).catch(()=>{});
    const tomb=JSON.parse(localStorage.getItem('dm_del')||'[]');
    tomb.forEach(([col,id])=>famRef.collection(col).doc(id).delete().catch(()=>{}));
    localStorage.removeItem('dm_del');
    let firsts=0;
    COLS.forEach(col=>{
      let first=true;
      famRef.collection(col).onSnapshot(snap=>{
        const remote=snap.docs.map(d=>d.data());
        if(first){
          first=false;
          const rm=new Map(remote.map(x=>[x.id,x]));
          L(col).forEach(x=>{const r=rm.get(x.id);if(!r||(x.upd||0)>(r.upd||0)){famRef.collection(col).doc(x.id).set(x).catch(syncErr);rm.set(x.id,x)}});
          D[col]=[...rm.values()];
          if(++firsts===COLS.length)sync={st:'ok',msg:'Synchronizované s rodinou'};
        }else D[col]=remote;
        saveL(col);render();
      },syncErr);
    });
  }catch(e){syncErr(e)}
}
function parseConfig(txt){
  txt=String(txt||'').trim();
  try{const j=JSON.parse(txt);if(j.apiKey)return j}catch(e){}
  const o={};txt.replace(/(\w+)\s*:\s*["'`]([^"'`]+)["'`]/g,(_,k,v)=>{o[k]=v});
  return o.apiKey&&o.projectId?o:null;
}
function shareLink(){const c=fbCfg();if(!c)return'';return location.origin+location.pathname+'#pridat='+c.fam}
const standalone=()=>navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
function decodeInvite(txt){
  let t=String(txt||'').trim();
  for(let i=0;i<3;i++){try{const d=decodeURIComponent(t);if(d===t)break;t=d}catch(e){break}}
  const m=t.match(/pridat=([A-Za-z0-9+/=_ -]{40,})/);
  if(m){try{const c=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/ /g,'+')))));if(c&&c.config&&c.fam)return c}catch(e){}}
  const k=t.match(/pridat=([\w-]{12,40})/)||t.match(/\b(rodina-[\w-]{6,40})\b/i)||t.match(/^([\w-]{12,40})$/);
  if(k)return{config:DEFAULT_CFG,fam:k[1]};
  return null;
}
let joinHint=false;
function checkJoin(){
  if(!/pridat=/.test(location.hash))return;
  const c=decodeInvite(location.hash);
  if(!c){alert('Odkaz na pozvanie je neplatný.');history.replaceState(null,'',location.pathname);return}
  if(!standalone()&&/iPhone|iPad|iPod/.test(navigator.userAgent)){joinHint=true;return}
  if(confirm('Pripojiť toto zariadenie k rodine „'+(c.name||'Domácnosť')+'“?'))localStorage.setItem('dm_fb',JSON.stringify(c));
  history.replaceState(null,'',location.pathname);
}
function joinByPaste(){
  const t=prompt('Vlož kód rodiny alebo pozývací odkaz (napr. rodina-k3j9x2ab):');if(!t)return;
  const c=decodeInvite(t);if(!c){alert('Kód som nerozpoznal. Napíš ho presne tak, ako je v správe – napr. rodina-k3j9x2ab (aspoň 12 znakov).');return}
  localStorage.setItem('dm_fb',JSON.stringify(c));toast('Pripájam k rodine…');startSync();render();
}

/* ============ Kalendárne položky (agenda) ============ */
const REP={none:'Neopakuje sa',daily:'Denne',weekly:'Každý týždeň',monthly:'Každý mesiac',yearly:'Každý rok'};
function occ(start,rep,from,to){
  const out=[];if(!start)return out;
  if(!rep||rep==='none'){if(start>=from&&start<=to)out.push(start);return out}
  let d=start,i=0;
  if(rep==='yearly'){const y0=Math.max(parse(start).getFullYear(),parse(from).getFullYear());d=y0+start.slice(4);if(d<start)d=start}
  while(d<from&&i<2000){d=step(d,rep,start);i++}
  while(d<=to&&i<2400){out.push(d);d=step(d,rep,start);i++}
  return out;
}
function step(d,rep,start){
  if(rep==='daily')return addDays(d,1);if(rep==='weekly')return addDays(d,7);
  if(rep==='monthly'){const d2=addMonths(d,1);const want=parse(start).getDate();const p=parse(d2);const last=new Date(p.getFullYear(),p.getMonth()+1,0).getDate();p.setDate(Math.min(want,last));return iso(p)}
  if(rep==='yearly')return addMonths(d,12);return '9999-12-31';
}
function maintNext(m){return m.last&&num(m.interval)?addMonths(m.last,num(m.interval)):(m.next||'')}
function agenda(from,to){
  const out=[];const inR=d=>d&&d>=from&&d<=to;
  L('events').forEach(e=>occ(e.date,e.repeat,from,to).forEach(d=>out.push({d,t:e.time||'',ic:e.icon||'📌',title:e.title,sub:(e.who||[]).map(mName).join(', '),k:'ev',c:'#007aff',id:e.id})));
  const y1=parse(from).getFullYear(),y2=parse(to).getFullYear();
  for(let y=y1;y<=y2;y++){
    L('members').forEach(m=>{
      if(m.bday){const d=y+m.bday.slice(4);if(inR(d)){const age=y-parse(m.bday).getFullYear();out.push({d,t:'',ic:'🎂',title:'Narodeniny – '+m.name+(age>0&&age<120?' ('+age+')':''),k:'bd',c:'#ff2d55',id:m.id})}}
      if(m.nameday){const d=y+m.nameday.slice(4);if(inR(d))out.push({d,t:'',ic:'🌸',title:'Meniny – '+m.name,k:'bd',c:'#ff2d55',id:m.id})}
    });
    [[y+'-12-06','🎅','Mikuláš'],[y+'-12-24','🎄','Štedrý deň'],[y+'-12-31','🎆','Silvester']].forEach(([d,ic,t])=>{if(inR(d))out.push({d,t:'',ic,title:t,k:'hol',c:'#34c759'})});
  }
  L('bills').filter(b=>!b.paid).forEach(b=>{if(inR(b.due))out.push({d:b.due,t:'',ic:'💶',title:b.name+' – '+eur(b.amount),k:'bill',c:'#ff9500',id:b.id})});
  L('maint').forEach(m=>{const n=maintNext(m);if(inR(n))out.push({d:n,t:'',ic:m.car?'🚗':'🔧',title:m.name+(m.car&&carName(m.car)?' – '+carName(m.car).replace(/^\S+ /,''):''),k:'maint',c:'#8e8e93',id:m.id})});
  L('tasks').filter(t=>!t.done).forEach(t=>{if(inR(t.due))out.push({d:t.due,t:'',ic:'✅',title:t.title,sub:t.who?mName(t.who):'',k:'task',c:'#af52de',id:t.id})});
  visibleNotes().filter(n=>n.date).forEach(n=>{if(inR(n.date))out.push({d:n.date,t:'',ic:'💬',title:n.text.slice(0,60),sub:'Odkaz od '+mName(n.from),k:'note',c:'#30b0c7',id:n.id})});
  return out.sort((a,b)=>(a.d+a.t).localeCompare(b.d+b.t));
}
function agRow(a,showDate){
  return `<button class="row" data-a="ag" data-k="${a.k}" data-id="${a.id||''}" data-d="${a.d}"><div class="ic" style="background:${a.c}22;color:${a.c}">${a.ic}</div><div class="main"><div class="t">${esc(a.title)}</div>${(a.sub||showDate)?`<div class="s">${showDate?esc(rel(a.d)):''}${a.t?' · '+a.t:''}${a.sub?(showDate?' · ':'')+esc(a.sub):''}</div>`:''}</div>${!showDate&&a.t?`<div class="r">${a.t}</div>`:''}</button>`;
}

/* ============ Odkazy ============ */
function visibleNotes(){return L('notes').filter(n=>n.to==='all'||!n.to||n.to===me||n.from===me)}
function unreadNotes(){return visibleNotes().filter(n=>n.from!==me&&!(n.readBy||[]).includes(me))}
function noteCard(n){
  const unread=n.from!==me&&!(n.readBy||[]).includes(me);
  const readers=(n.readBy||[]).filter(x=>x!==n.from);
  const targets=n.to&&n.to!=='all'?[n.to]:L('members').map(m=>m.id).filter(x=>x!==n.from);
  const notYet=targets.filter(x=>!readers.includes(x));
  return `<div class="note${unread?' unread':''}"><div class="h">${mTag(n.from,1)}<b style="color:var(--text)">${esc(mName(n.from))}</b><span>→ ${n.to&&n.to!=='all'?esc(mName(n.to)):'všetkým'}</span><span style="margin-left:auto">${ago(n.ts)}</span></div>
  <div class="tx">${esc(n.text)}</div>
  <div class="f"><span>${n.date?'📅 '+esc(fmtDL(n.date))+' · ':''}${n.from===me?(notYet.length?'Nečítal: '+notYet.map(mName).map(esc).join(', '):'Prečítali všetci ✓'):(readers.length?'Prečítal: '+readers.map(mName).map(esc).join(', '):'')}</span>
  ${unread?`<button class="btn" data-a="noteRead" data-id="${n.id}">Prečítané ✓</button>`:(n.from===me?`<button class="btn g" data-a="noteEdit" data-id="${n.id}">Upraviť</button>`:'')}</div></div>`;
}

/* ============ Formuláre ============ */
let sheetSave=null,sheetDel=null;
function openSheet(title,body,{save,saveLabel='Uložiť',onDel,delLabel='Vymazať'}={}){
  sheetSave=save||null;sheetDel=onDel||null;
  $('#sh').innerHTML=`<div class="sheet-h"><button class="lnk" data-a="closeSheet">${save?'Zrušiť':'Zavrieť'}</button><b>${esc(title)}</b>${save?`<button class="lnk b" data-a="sheetSave">${esc(saveLabel)}</button>`:'<span class="lnk"></span>'}</div><div class="sheet-b">${body}${onDel?`<button class="delbtn" data-a="sheetDel">${esc(delLabel)}</button>`:''}</div>`;
  $('#ov').classList.add('on');$('#sh').classList.add('on');
  setTimeout(()=>{const f=$('#sh [autofocus]');if(f)f.focus()},350);
}
function closeSheet(){$('#ov').classList.remove('on');$('#sh').classList.remove('on');sheetSave=sheetDel=null}
function memOpts(any){return (any?[['',any]]:[]).concat(L('members').map(m=>[m.id,(m.emoji?m.emoji+' ':'')+m.name]))}
function fld(f,v){
  const id='f_'+f.k;v=v??f.def??'';
  if(f.t==='area')return `<div class="fblk"><div class="flab">${esc(f.l)}</div><textarea id="${id}" rows="${f.rows||3}" placeholder="${esc(f.ph||'')}" ${f.af?'autofocus':''}>${esc(v)}</textarea></div>`;
  if(f.t==='check')return `<label class="frow"><span>${esc(f.l)}</span><input type="checkbox" class="sw" id="${id}" ${v?'checked':''}></label>`;
  if(f.t==='sel'||f.t==='mem'){const o=f.t==='mem'?memOpts(f.any):f.o;return `<label class="frow"><span>${esc(f.l)}</span><select id="${id}">${o.map(x=>{const[val,lab]=Array.isArray(x)?x:[x,x];return `<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(lab)}</option>`}).join('')}</select></label>`}
  if(f.t==='mems'){v=Array.isArray(v)?v:[];return `<div class="fblk"><div class="flab">${esc(f.l)}</div><div class="chips" id="${id}">${L('members').map(m=>`<button type="button" class="chip ${v.includes(m.id)?'on':''}" data-a="chipT" data-v="${m.id}">${esc((m.emoji||'')+' '+m.name)}</button>`).join('')}</div></div>`}
  if(f.t==='html')return f.h;
  const type=f.t==='num'?'text':(f.t||'text');
  return `<label class="frow"><span>${esc(f.l)}</span><input id="${id}" type="${type}" ${f.t==='num'?'inputmode="decimal"':''} value="${esc(v)}" placeholder="${esc(f.ph||'')}" ${f.af?'autofocus':''} autocomplete="off"></label>`;
}
function form(title,groups,val,onSave,onDel,extra=''){
  val=val||{};
  const G=Array.isArray(groups[0])?groups:[groups];
  const all=G.flat();
  const body=G.map((g,i)=>`<div class="grp" style="${i?'margin-top:18px':''}">${g.map(f=>fld(f,val[f.k])).join('')}</div>${g.hint?'':''}`).join('')+extra;
  openSheet(title,body,{save:()=>{
    const o={...val};let bad=null;
    all.forEach(f=>{if(f.t==='html')return;const el=$('#f_'+f.k);if(!el)return;
      let v;if(f.t==='check')v=el.checked;else if(f.t==='mems')v=[...el.querySelectorAll('.chip.on')].map(c=>c.dataset.v);else if(f.t==='num')v=el.value.trim()===''?'':num(el.value);else v=el.value.trim();
      if(f.req&&(v===''||v==null)){bad=bad||f;el.closest('.frow,.fblk')?.classList.add('err')}
      o[f.k]=v});
    if(bad){toast('Vyplň: '+bad.l);return}
    if(onSave(o)!==false)closeSheet();
  },onDel:onDel?()=>{if(confirm('Naozaj vymazať?')){onDel();closeSheet()}}:null});
}

/* ============ Render ============ */
function render(){
  const app=$('#app');
  const act=document.activeElement;let keep=null;
  if(act&&act.id&&app.contains(act))keep={id:act.id,v:act.value,s:act.selectionStart};
  const y=scrollY;
  if(joinHint){app.innerHTML=vJoinHint();$('#tabbar').style.display='none';return}
  if(!L('members').length&&fbCfg()&&!S.forceWelcome){
    const c=fbCfg();const slow=Date.now()-syncStart>12000;
    let h;
    if(sync.st==='ok')h=`<div class="welcome"><div class="logo">🤔</div><h1>Rodina je zatiaľ prázdna</h1><p class="muted">V rodine s kódom <b>${esc(c.fam)}</b> ešte nie sú žiadni členovia.</p></div>
      <div class="card small">Najprv musí zariadenie, na ktorom sú zadaní členovia (napr. Mac), kliknúť na <b>Viac → Nastavenia a zdieľanie → Pripojiť a zdieľať</b> a mať zelenú bodku <b>Pripojené</b>. Potom tu klikni na <b>Skúsiť znova</b>.<br><br>Skontroluj aj, či je kód rovnaký ako v Nastaveniach na Macu.</div>`;
    else if(sync.st==='err'||slow)h=`<div class="welcome"><div class="logo">📡</div><h1>Nedá sa pripojiť</h1><p class="muted">${esc(sync.msg||'Pripojenie trvá príliš dlho. Skontroluj internet.')}</p></div>`;
    else h=`<div class="welcome"><div class="logo">🏡</div><h1>Načítavam rodinu…</h1><p class="muted">Chvíľu strpenia, sťahujem údaje.</p></div>`;
    if(sync.st==='ok'||sync.st==='err'||slow)h+=`<div style="margin-top:16px;display:grid;gap:10px"><button class="btn big" data-a="reload">Skúsiť znova</button><button class="btn big g" data-a="joinOther">Zadať iný kód rodiny</button><button class="btn big g" data-a="firstMember">Som prvý – vytvoriť rodinu s týmto kódom</button></div>`;
    else setTimeout(()=>{if(!L('members').length)render()},12500);
    app.innerHTML=h;$('#tabbar').style.display='none';return}
  if(!L('members').length){app.innerHTML=vWelcome();$('#tabbar').style.display='none';return}
  if(!me||!mem(me)){app.innerHTML=vWho();$('#tabbar').style.display='none';return}
  $('#tabbar').style.display='';
  let h='';
  if(S.tab==='home')h=vHome();else if(S.tab==='shop')h=vShop();else if(S.tab==='cal')h=vCal();else if(S.tab==='gift')h=vGift();
  else h=S.sub?({tasks:vTasks,bills:vBills,maint:vMaint,energy:vEnergy,members:vMembers,settings:vSettings}[S.sub]||vMore)():vMore();
  app.innerHTML=h;
  renderTabs();
  scrollTo(0,y);
  if(keep){const e=document.getElementById(keep.id);if(e){e.value=keep.v;e.focus();try{e.setSelectionRange(keep.s,keep.s)}catch(x){}}}
  if(S.tab==='cal'&&S.seg.cal==='notes')setTimeout(markNotesRead,1500);
}
function renderTabs(){
  const un=unreadNotes().length;
  const lt=isKid()?0:L('letters').filter(l=>!l.read&&l.from!==me).length;
  const od=L('bills').filter(b=>!b.paid&&b.due&&daysTo(b.due)<0).length+L('maint').filter(m=>{const n=maintNext(m);return n&&daysTo(n)<0}).length;
  const shopN=L('shopping').filter(s=>!s.done).length;
  const tabs=[['home','Domov',0],['shop','Nákup',shopN],['cal','Kalendár',un],['gift','Darčeky',lt],['more','Viac',od]];
  $('#tabbar').innerHTML=tabs.map(([k,l,b])=>`<button class="${S.tab===k?'on':''}" data-a="tab" data-v="${k}">${ICO[k]}<span>${l}</span>${b?`<span class="badge"${k==='shop'?' style="background:var(--sec)"':''}>${b}</span>`:''}</button>`).join('');
}
function hdr(title,sub,btn){return `<div class="hdr"><div><h1>${title}</h1>${sub?`<div class="sub">${sub}</div>`:''}</div>${btn||''}</div>`}
function backHdr(title,btn){return `<button class="back" data-a="back">‹ Viac</button>`+hdr(title,'',btn)}
const plus=(a,extra='')=>`<button class="hbtn" data-a="${a}" ${extra} aria-label="Pridať">＋</button>`;
const seg=(g,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button class="${S.seg[g]===v?'on':''}" data-a="seg" data-g="${g}" data-v="${v}">${l}</button>`).join('')}</div>`;

/* ---------- Domov ---------- */
function vHome(){
  const m=mem(me);const hr=new Date().getHours();
  const greet=hr<10?'Dobré ráno':hr<18?'Dobrý deň':'Dobrý večer';
  const t=today();let h=hdr(`${greet}, ${esc(m.name)}`,fmtDL(t)+(meta().famName?' · '+esc(meta().famName):''),`<button data-a="tab" data-v="more" data-sub="members">${mTag(me)}</button>`);
  h+=`<div class="tiles">
  <button class="tile" data-a="noteNew"><div class="ic" style="background:var(--teal)">💬</div>Odkaz</button>
  <button class="tile" data-a="tab" data-v="shop"><div class="ic" style="background:var(--green)">🛒</div>Nákup</button>
  <button class="tile" data-a="evNew"><div class="ic" style="background:var(--blue)">📅</div>Udalosť</button>
  <button class="tile" data-a="taskNew"><div class="ic" style="background:var(--purple)">✅</div>Úloha</button></div>`;
  const un=unreadNotes();
  if(un.length)h+=`<div class="sect">Nové odkazy pre teba</div>`+un.slice(0,5).map(noteCard).join('');
  const ag=agenda(t,addDays(t,7)).filter(a=>['ev','bd','hol','note'].includes(a.k));
  h+=`<div class="sect">Najbližšie dni<button data-a="tab" data-v="cal">Kalendár</button></div><div class="grp">${ag.length?ag.slice(0,7).map(a=>agRow(a,true)).join(''):'<div class="empty">Najbližší týždeň nič naplánované.</div>'}</div>`;
  const tasks=L('tasks').filter(x=>!x.done&&(!x.who||x.who===me)&&(!x.due||daysTo(x.due)<=3)).sort(byDue);
  h+=`<div class="sect">Moje úlohy<button data-a="sub" data-v="tasks">Všetky</button></div><div class="grp">${tasks.length?tasks.slice(0,6).map(taskRow).join(''):'<div class="empty">Žiadne úlohy na najbližšie dni 🎉</div>'}</div>`;
  if(!isKid()){
    const bills=L('bills').filter(b=>!b.paid&&b.due&&daysTo(b.due)<=14).sort((a,b)=>a.due.localeCompare(b.due));
    if(bills.length)h+=`<div class="sect">Platby<button data-a="sub" data-v="bills">Financie</button></div><div class="grp">${bills.map(billRow).join('')}</div>`;
    const mt=L('maint').filter(x=>{const n=maintNext(x);return n&&daysTo(n)<=30}).sort((a,b)=>maintNext(a).localeCompare(maintNext(b)));
    if(mt.length)h+=`<div class="sect">Údržba a revízie<button data-a="sub" data-v="maint">Všetko</button></div><div class="grp">${mt.map(maintRow).join('')}</div>`;
  }
  const sh=L('shopping').filter(s=>!s.done);
  h+=`<div class="sect">Nákupný zoznam</div><div class="grp"><button class="row chev" data-a="tab" data-v="shop"><div class="ic" style="background:var(--green)">🛒</div><div class="main"><div class="t">${sh.length?sh.length+' '+(sh.length===1?'položka':sh.length<5?'položky':'položiek'):'Zoznam je prázdny'}</div>${sh.length?`<div class="s">${esc(sh.slice(0,5).map(s=>s.name).join(', '))}${sh.length>5?'…':''}</div>`:''}</div></button></div>`;
  if(sync.st==='local'&&L('members').length>1)h+=`<p class="hint">Dáta sú zatiaľ len v tomto zariadení. Zdieľanie s rodinou zapneš vo <a href="#" data-a="goSettings">Viac → Nastavenia</a>.</p>`;
  if(sync.st==='err')h+=`<p class="hint" style="color:var(--red)">⚠️ Synchronizácia: ${esc(sync.msg)}</p>`;
  return h;
}

/* ---------- Nákup ---------- */
const SHOPCATS=['Potraviny','Ovocie a zelenina','Mäso','Pečivo','Drogéria','Domácnosť','Lekáreň','Záhrada','Iné'];
function vShop(){
  const items=L('shopping');const open=items.filter(i=>!i.done),done=items.filter(i=>i.done);
  let h=hdr('Nákup',open.length?open.length+' na kúpenie':'Všetko kúpené');
  h+=`<div class="addbar"><input id="shopIn" placeholder="Pridať položku…" enterkeyhint="done" autocomplete="off"><button data-a="shopAdd">＋</button></div>`;
  h+=`<div class="chips scroll">${SHOPCATS.map(c=>`<button class="chip ${S.shopCat===c?'on':''}" data-a="shopCat" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
  const freq=JSON.parse(localStorage.getItem('dm_freq')||'{}');const openN=new Set(open.map(i=>i.name.toLowerCase()));
  const sug=Object.entries(freq).filter(([n])=>!openN.has(n.toLowerCase())).sort((a,b)=>b[1].n-a[1].n).slice(0,10);
  if(sug.length)h+=`<div class="sect" style="margin-top:10px">Často kupujete</div><div class="chips scroll">${sug.map(([n])=>`<button class="chip" data-a="shopSug" data-v="${esc(n)}">＋ ${esc(n)}</button>`).join('')}</div>`;
  if(!open.length)h+=`<div class="card empty" style="margin-top:14px">🛒 Nákupný zoznam je prázdny.<br>Napíš položku hore – uvidí ju celá rodina.</div>`;
  SHOPCATS.forEach(c=>{const it=open.filter(i=>(i.cat||'Iné')===c);if(!it.length)return;
    h+=`<div class="sect">${esc(c)}</div><div class="grp">${it.sort((a,b)=>a.ts-b.ts).map(shopRow).join('')}</div>`});
  if(done.length)h+=`<div class="sect">V košíku (${done.length})<button data-a="shopClear">Vymazať kúpené</button></div><div class="grp">${done.sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)).slice(0,30).map(shopRow).join('')}</div>`;
  return h;
}
function shopRow(i){return `<div class="row ${i.done?'done':''}"><button class="chk ${i.done?'on':''}" data-a="shopToggle" data-id="${i.id}" aria-label="Kúpené"></button><button class="main" style="text-align:left" data-a="shopEdit" data-id="${i.id}"><div class="t">${esc(i.name)}${i.qty?` <span class="muted">· ${esc(i.qty)}</span>`:''}</div>${i.note?`<div class="s">${esc(i.note)}</div>`:''}</button>${i.urgent&&!i.done?'<span class="pill red">Súrne</span>':''}${mTag(i.by,1)}</div>`}
function shopAdd(name){
  name=String(name||'').trim();if(!name)return;
  let qty='';const m=name.match(/^(\d+[.,]?\d*\s*(ks|kg|g|l|ml|bal|x)?)\s+(.+)$/i);if(m){qty=m[1];name=m[3]}
  const freq=JSON.parse(localStorage.getItem('dm_freq')||'{}');const f=freq[name]||{n:0,cat:S.shopCat};f.n++;freq[name]=f;localStorage.setItem('dm_freq',JSON.stringify(freq));
  put('shopping',{name,qty,cat:freq[name].cat||S.shopCat,by:me,ts:Date.now(),done:false});
}

function enCalc(r){const pv=num(r.pv),imp=num(r.imp),exp=num(r.exp),hp=num(r.hp);const self=Math.max(0,pv-exp),cons=imp+self;return{pv,imp,exp,hp,self,cons,selfPct:pv?self/pv:NaN,aut:cons?self/cons:NaN,temp:r.temp===''||r.temp==null?null:num(r.temp)}}

    ${(()=>{const hm=yr.filter(r=>num(r.heat)&&num(r.hp));if(!hm.length)return'';const ht=hm.reduce((a,r)=>a+num(r.heat),0),hc=hm.reduce((a,r)=>a+num(r.hp),0);return `<div class="stat"><div class="l">🔥 SCOP tepelného čerpadla</div><div class="v" style="color:var(--purple)">${(ht/hc).toFixed(2).replace('.',',')}</div><div class="small muted">z ${hm.length} mes. · ${kwh(ht)} tepla</div></div>`})()}</div>`;

  }

  return h;
}

let avatarDraft='';
function avPrevHtml(m){const c=(m&&m.color)||'#8e8e93';return avatarDraft?`<img src="${avatarDraft}" style="width:64px;height:64px;border-radius:32px;object-fit:cover;background:${c}">`:`<span class="av" style="width:64px;height:64px;border-radius:32px;font-size:32px;background:${c}">${esc((m&&(m.emoji||(m.name||'?')[0]))||'?')}</span>`}
function setAvatarFromBlob(blob){
  if(!blob||!/^image\//.test(blob.type)){toast('To nie je obrázok');return}
  const url=URL.createObjectURL(blob);const img=new Image();
  img.onload=()=>{const S0=160,c=document.createElement('canvas');c.width=c.height=S0;const x=c.getContext('2d');const s=Math.min(img.width,img.height);
    x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,S0,S0);URL.revokeObjectURL(url);
    let d=c.toDataURL('image/webp',.82);if(!d.startsWith('data:image/webp'))d=c.toDataURL('image/jpeg',.85);
    if(/png/.test(blob.type)){const d2=c.toDataURL('image/png');if(d2.length<60000&&!d.startsWith('data:image/webp'))d=d2}
    avatarDraft=d;const pv=$('#avPrev');if(pv)pv.innerHTML=avPrevHtml({color:'#8e8e93'});toast('Fotka pripravená – ulož člena')};
  img.onerror=()=>{toast('Obrázok sa nepodarilo načítať');URL.revokeObjectURL(url)};img.src=url;
}
document.addEventListener('paste',e=>{if(!$('#avPrev')||!$('#sh').classList.contains('on'))return;const f=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));if(f){e.preventDefault();setAvatarFromBlob(f.getAsFile())}});
document.addEventListener('change',e=>{if(e.target.id==='avFile'&&e.target.files[0])setAvatarFromBlob(e.target.files[0])});

/* ============ Grafy ============ */
function niceStep(x){if(!x)return 1;const p=10**Math.floor(Math.log10(x));const n=x/p;return(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function chart(labels,series,line,unit){
  const W=340,H=180,pl=34,pr=line?30:6,pt=10,pb=20,cw=W-pl-pr,ch=H-pt-pb;
  const mx=Math.max(0,...series.flatMap(s=>s.v.map(x=>x||0)));const st=niceStep(mx/4||1);const max=st*Math.max(1,Math.ceil(mx/st));
  const fmt=v=>v>=1000?(v/1000).toFixed(v%1000?1:0).replace('.',',')+'k':String(Math.round(v*10)/10).replace('.',',');
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart">`;
  for(let v=0;v<=max+1e-9;v+=st){const y=pt+ch-v/max*ch;s+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-4}" y="${y+3}" text-anchor="end">${fmt(v)}</text>`}
  const gw=cw/labels.length,bw=Math.max(2,gw*.76/series.length);
  labels.forEach((l,i)=>{const x0=pl+i*gw+gw*.12;series.forEach((se,j)=>{const v=se.v[i]||0;const hh=v/max*ch;if(hh>0)s+=`<rect x="${x0+j*bw}" y="${pt+ch-hh}" width="${bw-1}" height="${hh}" rx="1.5" fill="${se.c}"><title>${esc(se.n)}: ${fmt(v)} ${unit||''}</title></rect>`});s+=`<text x="${pl+i*gw+gw/2}" y="${H-6}" text-anchor="middle">${esc(l)}</text>`});
  if(line){const vals=line.v.filter(v=>v!=null);if(vals.length){let lo=Math.min(...vals),hi=Math.max(...vals);if(hi===lo){hi+=1;lo-=1}const pad2=(hi-lo)*.15;lo-=pad2;hi+=pad2;
    const pts=line.v.map((v,i)=>v==null?null:[pl+i*gw+gw/2,pt+ch-(v-lo)/(hi-lo)*ch]);
    let d='';pts.forEach((p,i)=>{if(!p)return;d+=(i&&pts[i-1]?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)});
    s+=`<path d="${d}" fill="none" stroke="${line.c}" stroke-width="2"/>`+pts.map((p,i)=>p?`<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="${line.c}"><title>${line.v[i]} °C</title></circle>`:'').join('');
    s+=`<text x="${W-pr+4}" y="${pt+6}">${Math.round(hi)}°</text><text x="${W-pr+4}" y="${pt+ch}">${Math.round(lo)}°</text>`}}
  s+='</svg>';
  return s+`<div class="legend">${series.map(x=>`<span><i style="background:${x.c}"></i>${esc(x.n)}</span>`).join('')}${line?`<span><i style="background:${line.c};border-radius:5px"></i>${esc(line.n)}</span>`:''}</div>`;
}

    if(!cfg){toast('Nerozpoznal som firebaseConfig – skopíruj celý blok');return}if(fam.length<12){toast('Kód rodiny musí mať aspoň 12 znakov');return}
    localStorage.setItem('dm_fb',JSON.stringify({config:cfg,fam,name:meta().famName||''}));startSync()},
  syncShare:()=>{const c=fbCfg();c.name=meta().famName||'';localStorage.setItem('dm_fb',JSON.stringify(c));const link=shareLink();const txt='Pridaj sa do našej rodinnej apky Domácnosť 🏡\n1) Otvor v Safari '+location.origin+location.pathname+' a daj Zdieľať → Pridať na plochu.\n2) Otvor apku z plochy → Mám pozývací odkaz → napíš kód rodiny:\n'+c.fam;
    if(navigator.share)navigator.share({title:'Domácnosť',text:txt}).catch(()=>{});else{copy(link,'Odkaz skopírovaný');window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank')}},
  syncOff:()=>{if(!confirm('Odpojiť toto zariadenie od rodiny? Dáta ostanú v tomto zariadení aj u ostatných.'))return;localStorage.removeItem('dm_fb');location.reload()},
  exportJ:()=>{const data={app:'domacnost',v:1,at:new Date().toISOString()};COLS.forEach(c=>data[c]=L(c));const b=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='domacnost-zaloha-'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)},
};
function evForm(ev,d){
  ev=ev||{date:d||today(),who:[],repeat:'none',icon:'📌'};
  form(ev.id?'Udalosť':'Nová udalosť',[[{k:'title',l:'Názov',req:1,af:!ev.id,ph:'napr. Návšteva u babky'},{k:'icon',l:'Ikona',t:'sel',o:['📌','🎉','🏥','🦷','🏫','⚽','✈️','🚗','👨‍🔧','🍽️','🎂','💼','🐶']}],[{k:'date',l:'Dátum',t:'date',req:1},{k:'time',l:'Čas',t:'time'},{k:'repeat',l:'Opakovanie',t:'sel',o:Object.entries(REP)}],[{k:'who',l:'Kto ide / koho sa týka',t:'mems'}],[{k:'note',l:'Poznámka',t:'area',rows:2}]],ev,
  o=>{if(!o.id)o.by=me;put('events',o);S.calDay=o.date;S.calMonth=o.date.slice(0,7);toast('Uložené')},ev.id?()=>del('events',ev.id):null);
}
function noteForm(n,d){
  n=n||{to:'all',date:d||''};
  form(n.id?'Upraviť odkaz':'Nový odkaz',[[{k:'text',l:'Odkaz',t:'area',rows:4,req:1,af:1,ph:'napr. Kúp cestou chlieb 🍞'}],[{k:'to',l:'Komu',t:'sel',o:[['all','Všetkým']].concat(L('members').filter(m=>m.id!==me).map(m=>[m.id,(m.emoji?m.emoji+' ':'')+m.name]))},{k:'date',l:'Ukázať v kalendári',t:'date'}]],n,
  o=>{if(!o.id){o.from=me;o.ts=Date.now();o.readBy=[me]}put('notes',o);toast('Odkaz odoslaný 💬')},n.id?()=>del('notes',n.id):null,
  `<p class="hint">Dátum je nepovinný – odkaz sa potom ukáže aj v kalendári v daný deň.</p>`);
}
function giftForm(g){
  const own=g.for===me&&!g.secret;
  const fields=[[{k:'text',l:own?'Čo si želám':'Nápad na darček',req:1,af:!g.id},{k:'occ',l:'Príležitosť',t:'sel',o:OCC},{k:'price',l:'Cena cca (€)',t:'num'}],[{k:'link',l:'Odkaz (e-shop)',t:'url',ph:'https://…'},{k:'note',l:'Poznámka',ph:'veľkosť, farba…'}]];
  if(g.for!==me)fields.push([{k:'secret',l:'Tajné (obdarovaný nevidí)',t:'check'}]);
  form(g.id?(own?'Moje želanie':'Darček pre '+mName(g.for)):(own?'Nové želanie':'Nápad pre '+mName(g.for)),fields,g,
  o=>{put('gifts',o);toast('Uložené 🎁')},g.id&&(g.by===me||g.for===me)?()=>del('gifts',g.id):null,
  g.id&&!own&&g.resBy===me&&!g.bought?`<div style="margin-top:14px"><button class="btn big g" data-a="giftUnres" data-id="${g.id}">Zrušiť moju rezerváciu</button></div>`:'');
}
A.avClear=()=>{avatarDraft='';const pv=$('#avPrev');if(pv)pv.innerHTML=avPrevHtml({color:'#8e8e93',name:'?'})};
A.avPaste=async()=>{try{const items=await navigator.clipboard.read();for(const it of items){const t=it.types.find(t=>t.startsWith('image/'));if(t){setAvatarFromBlob(await it.getType(t));return}}toast('V schránke nie je obrázok')}catch(e){toast('Stlač Cmd+V (na iPhone podrž prst → Vložiť)')}};
A.giftUnres=e=>{const g=L('gifts').find(x=>x.id===e.dataset.id);if(g){put('gifts',{...g,resBy:''});closeSheet()}};
function copy(t,msg){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(msg)).catch(()=>{prompt('Skopíruj:',t)})}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  if(el.tagName==='A')e.preventDefault();
  const f=A[el.dataset.a]||{closeSheet,sheetSave:()=>sheetSave&&sheetSave(),sheetDel:()=>sheetDel&&sheetDel()}[el.dataset.a];
  if(f)f(el);
});
$('#ov').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='shopIn'){e.preventDefault();A.shopAdd()}
  if(e.key==='Enter'&&e.target.id==='w_name'){A.welcome()}
});
document.addEventListener('change',e=>{
  if(e.target.id!=='impFile')return;const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!=='domacnost')throw 0;if(!confirm('Obnoviť zo zálohy? Položky zo zálohy sa pridajú/prepíšu.'))return;
    COLS.forEach(c=>(d[c]||[]).forEach(x=>put(c,x,true)));render();toast('Obnovené')}catch(x){alert('Toto nie je záloha Domácnosti.')}};r.readAsText(f);
});


checkJoin();
render();
startSync();
setInterval(()=>{if(!$('#sh').classList.contains('on')&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA')render()},60000);
</script>
